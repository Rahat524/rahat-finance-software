<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HC Ledger Login</title><style>*{box-sizing:border-box}body{margin:0;background:#edf1f5;color:#17365d;font:15px 'Trebuchet MS',Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}main{width:100%;max-width:410px;background:white;border:1px solid #b9c7d5;border-radius:7px;overflow:hidden}h1{margin:0;padding:23px;background:#17365d;color:white;font-size:23px}form{padding:26px}label{display:block;margin:0 0 18px}input{display:block;width:100%;padding:12px;margin-top:7px;border:1px solid #b9c7d5;border-radius:4px;font:inherit}button{background:#234668;color:white;padding:12px;width:100%;border:0;border-radius:4px;font:inherit;cursor:pointer}p{font-size:13px}#error{color:#a12217}button:disabled{opacity:.6}</style></head><body><main><h1>HC Ledger - Lahore-4</h1><form><p>Sign in to your HC workbook.</p><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p id="error" role="alert"></p></form></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('button');b.disabled=true;try{const f=new FormData(e.target);const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const j=await r.json();if(j.ok)location.href='/hc-ledger';else document.getElementById('error').textContent='Username or password is incorrect.';}catch(err){document.getElementById('error').textContent='Unable to sign in. Please try again.';}finally{b.disabled=false;}};</script></body></html>
